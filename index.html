<script>/* FEFCO SOLUTIONS branding: real logo + app name on every screen */
(function () {
  var LOGO = (window.FEFCO_LOGO = window.FEFCO_LOGO || './logo.png');
  function txt(t) { if (t.nodeValue && t.nodeValue.indexOf('FEFCO Leads') >= 0) t.nodeValue = t.nodeValue.replace(/FEFCO Leads/g, 'FEFCO SOLUTIONS'); }
  function img(i) { if (/googleusercontent/.test(i.getAttribute('src') || '') && /logo/i.test(i.alt || '')) { i.src = LOGO; i.alt = 'FEFCO SOLUTIONS'; } }
  function fix(n) {
    if (n.nodeType === 3) return txt(n);
    if (n.nodeType !== 1) return;
    if (n.tagName === 'IMG') img(n);
    var w = document.createTreeWalker(n, 4), t; while ((t = w.nextNode())) txt(t);
    if (n.querySelectorAll) n.querySelectorAll('img').forEach(img);
  }
  new MutationObserver(function (ms) { ms.forEach(function (m) { if (m.type === 'characterData') txt(m.target); else m.addedNodes.forEach(fix); }); })
    .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
})();
</script>
